name: Import prepared SEFM project
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: initial-sefm-import
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand the prepared source and data
        if: hashFiles('project-import.zip') != ''
        run: |
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import zipfile
          with zipfile.ZipFile('project-import.zip') as archive:
              for name in archive.namelist():
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts or '.git' in path.parts:
                      raise ValueError('Unsafe source archive path')
              archive.extractall('.')
          PY
          git rm -- project-import.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m "Publish SEFM code, regional data, documentation and website"
          git push origin HEAD:main
